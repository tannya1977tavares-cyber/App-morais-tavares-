name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # versão começa em 1.0.11, depois da 1.0.6 que já foi instalada pelo outro repositório
      - name: Número da versão
        run: echo "VERSAO=$(( ${{ github.run_number }} + 10 ))" >> $GITHUB_ENV

      - name: Instalar dependências
        run: npm install

      - name: Copiar bibliotecas pro app
        run: |
          npm run libs
          echo "window.VERSAO_APP = ${VERSAO};" > www/versao.js

      - name: Criar projeto Android
        run: |
          npx cap add android
          python3 scripts/preparar-android.py
          npx cap sync android

      - name: Montar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OrcamentoMorais.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OrcamentoMorais-apk
          path: OrcamentoMorais.apk

      - name: Publicar pra baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.VERSAO }}
          name: Orçamento Morais Tavares 1.0.${{ env.VERSAO }}
          body: Baixe o arquivo OrcamentoMorais.apk no celular e instale. Quem já tem o app recebe o aviso de versão nova.
          files: OrcamentoMorais.apk
